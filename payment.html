<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Liwi-Ka | Payment</title><link rel="stylesheet" href="auth.css"><style>
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf8f1,#f0e7d8);color:#17130d;font-family:Georgia,'Times New Roman',serif}.wrap{width:min(720px,calc(100% - 24px));margin:0 auto;padding:30px 0 60px}.card{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:30px;box-shadow:0 22px 70px rgba(45,30,12,.1);border:1px solid rgba(255,255,255,.8)}.ey{font:700 10px Arial,sans-serif;letter-spacing:.2em;color:#c08b2d}.card h1{font-size:42px;font-weight:500;margin:8px 0}.muted{font:14px/1.6 Arial,sans-serif;color:#756b5d}.methods{display:grid;gap:10px;margin:24px 0}.method{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid rgba(38,28,15,.12);border-radius:14px;background:#fffdf9;cursor:pointer;font:600 13px Arial,sans-serif}.method.selected{border-color:#d9a441;background:rgba(217,164,65,.08)}.method input{accent-color:#c08b2d}.pay{width:100%;border:0;border-radius:14px;padding:17px;background:linear-gradient(135deg,#b98728,#e2b653,#b98728);color:white;font:700 11px Arial,sans-serif;letter-spacing:.16em;cursor:pointer}.secure{margin-top:15px;text-align:center;font:11px Arial,sans-serif;color:#766b5d}@media(max-width:600px){.wrap{padding-top:14px}.card{padding:21px;border-radius:22px}.card h1{font-size:34px}}
</style>    <link rel="stylesheet" href="free-delivery.css">
</head><body><main class="wrap"><section class="card"><p class="ey">FINAL STEP</p><h1>Payment.</h1><p class="muted">Choose how you'd like to complete your Liwi-Ka order.</p><div class="methods"><label class="method selected"><input type="radio" name="method" value="UPI / GPay" checked> UPI / GPay</label><label class="method"><input type="radio" name="method" value="Credit Card"> Credit Card</label><label class="method"><input type="radio" name="method" value="Net Banking"> Net Banking</label><label class="method"><input type="radio" name="method" value="Cash on Delivery"> Cash on Delivery</label></div><button class="pay" id="pay">PAY NOW</button><div class="secure">🔒 Secure checkout · Order total <strong id="total">₹0</strong></div></section></main><script>
(function(){const s=JSON.parse(sessionStorage.getItem('liwika_checkout_details')||'null');const total=Number(sessionStorage.getItem('liwika_checkout_total')||0);const auth=localStorage.getItem('liwika_auth_session');if(!auth||!s||!total){location.href='checkout.html';return}document.getElementById('total').textContent='₹'+total.toLocaleString('en-IN');document.querySelectorAll('.method').forEach(m=>m.addEventListener('click',()=>{document.querySelectorAll('.method').forEach(x=>x.classList.remove('selected'));m.classList.add('selected');m.querySelector('input').checked=true}));document.getElementById('pay').addEventListener('click',()=>{const method=document.querySelector('input[name=method]:checked').value;sessionStorage.setItem('liwika_payment_method',method);sessionStorage.setItem('liwika_payment_complete','1');location.href='order-confirmation.html'});})();
</script>    <script src="free-delivery.js"></script>
</body></html>
