<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liwi-Ka | Order Confirmed</title>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="responsive-mobile.css">
<style>
/* =========================================================
   ORDER CONFIRMATION — LIWI-KA SITE SYSTEM
   ========================================================= */
.confirm-page{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  color:#f5efe4;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(117,76,25,.16), transparent 34%),
    radial-gradient(circle at 8% 82%, rgba(157,105,31,.08), transparent 28%),
    #070605;
  font-family:"Font1",sans-serif;
  overflow-x:hidden;
}
.confirm-card{
  position:relative;padding:1px;border-radius:22px;
  width:min(620px,calc(100% - 40px));
  margin:110px auto 60px;
  background:linear-gradient(135deg,rgba(217,164,65,.22),rgba(255,255,255,.045) 24%,rgba(255,255,255,.025) 70%,rgba(217,164,65,.10));
  box-shadow:0 35px 100px rgba(0,0,0,.42);
}
.confirm-card::before{
  content:"";position:absolute;width:320px;height:180px;top:-90px;left:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(217,164,65,.10),transparent 68%);
  filter:blur(22px);pointer-events:none;
}
.confirm-inner{
  position:relative;z-index:1;padding:48px 34px;border-radius:21px;text-align:center;
  background:linear-gradient(145deg,rgba(32,25,17,.92),rgba(10,9,7,.97));
}
.mark{
  width:66px;height:66px;margin:0 auto 22px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#8e631c,#d8aa4a 48%,#9b6d20);
  border:1px solid rgba(236,198,105,.48);
  color:#100d08;font:32px Georgia,serif;
}
.confirm-inner .eyebrow{
  margin:0 0 12px;color:#d9a441;
  font:10px "Font1",sans-serif;letter-spacing:4px;text-transform:uppercase;
}
.confirm-inner h1{
  margin:0 0 12px;color:#f5efe4;
  font:400 clamp(38px,6vw,54px)/1 "Font",Georgia,serif;letter-spacing:-1px;
}
.confirm-inner .muted{margin:0 auto;max-width:420px;color:#8f877d;font:13px/1.8 "Font1",sans-serif}
.order-pill{
  display:inline-block;margin:24px auto;padding:13px 22px;
  border:1px solid rgba(217,164,65,.30);
  background:rgba(217,164,65,.07);
  color:#e2bf69;font:700 13px "Font1",sans-serif;letter-spacing:1.5px;
}
.home-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:200px;min-height:50px;margin-top:8px;padding:0 24px;
  border:1px solid rgba(236,198,105,.48);
  background:linear-gradient(100deg,#8e631c,#d8aa4a 48%,#9b6d20);
  color:#100d08;text-decoration:none;
  font:700 10px "Font1",sans-serif;letter-spacing:2.3px;
  transition:transform .25s,filter .25s;
}
.home-btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.confirm-footer{margin:0 auto 40px;text-align:center;color:#514b45;font:9px "Font1",sans-serif;letter-spacing:3px}
#cart-toast{display:none !important}

@media(max-width:430px){
  .confirm-card{margin:96px auto 40px}
  .confirm-inner{padding:34px 20px}
  .confirm-inner h1{font-size:36px}
}
</style>
<link rel="stylesheet" href="shared-navbar.css">
<link rel="stylesheet" href="free-delivery.css">
</head>
<body class="confirm-page">
<section class="confirm-card">
  <div class="confirm-inner">
    <div class="mark">✓</div>
    <p class="eyebrow">LIWI-KA</p>
    <h1>Order confirmed.</h1>
    <p class="muted">Thank you. Your sweetest moment is now on its way, delivering within Visakhapatnam.</p>
    <div class="order-pill" id="order"></div>
    <br>
    <a class="home-btn" href="index.html">BACK TO HOME</a>
  </div>
</section>
<script>
(function(){
  const complete=sessionStorage.getItem('liwika_payment_complete');
  if(complete!=='1'){location.href='seasonals/cart.html';return}
  let order=sessionStorage.getItem('liwika_current_order_number');
  if(!order){order='LK-'+String(Date.now()%90000+10000);sessionStorage.setItem('liwika_current_order_number',order)}
  document.getElementById('order').textContent='Order '+order;
  try{localStorage.setItem('liwika_last_order',JSON.stringify({orderNumber:order,email:(JSON.parse(localStorage.getItem('liwika_auth_session')||'{}').email||''),createdAt:new Date().toISOString()}))}catch(e){}
  if(window.LiwikaCart){window.LiwikaCart.clearCart&&window.LiwikaCart.clearCart()}
})();
</script>
<script src="free-delivery.js"></script>
</body>
</html>
