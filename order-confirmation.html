<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liwi-Ka | Order Confirmed</title>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="responsive-mobile.css">
<style>
/* =========================================================
   ORDER CONFIRMATION — LIWI-KA SITE SYSTEM
   ========================================================= */
.confirm-page{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  color:#f5efe4;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(117,76,25,.16), transparent 34%),
    radial-gradient(circle at 8% 82%, rgba(157,105,31,.08), transparent 28%),
    #070605;
  font-family:"Font1",sans-serif;
  overflow-x:hidden;
}
.confirm-card{
  position:relative;padding:1px;border-radius:22px;
  width:min(620px,calc(100% - 40px));
  margin:110px auto 60px;
  background:linear-gradient(135deg,rgba(217,164,65,.22),rgba(255,255,255,.045) 24%,rgba(255,255,255,.025) 70%,rgba(217,164,65,.10));
  box-shadow:0 35px 100px rgba(0,0,0,.42);
}
.confirm-card::before{
  content:"";position:absolute;width:320px;height:180px;top:-90px;left:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(217,164,65,.10),transparent 68%);
  filter:blur(22px);pointer-events:none;
}
.confirm-inner{
  position:relative;z-index:1;padding:48px 34px;border-radius:21px;text-align:center;
  background:linear-gradient(145deg,rgba(32,25,17,.92),rgba(10,9,7,.97));
}
.mark{
  width:66px;height:66px;margin:0 auto 22px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#8e631c,#d8aa4a 48%,#9b6d20);
  border:1px solid rgba(236,198,105,.48);
  color:#100d08;font:32px Georgia,serif;
}
.confirm-inner .eyebrow{
  margin:0 0 12px;color:#d9a441;
  font:10px "Font1",sans-serif;letter-spacing:4px;text-transform:uppercase;
}
.confirm-inner h1{
  margin:0 0 12px;color:#f5efe4;
  font:400 clamp(38px,6vw,54px)/1 "Font",Georgia,serif;letter-spacing:-1px;
}
.confirm-inner .muted{margin:0 auto;max-width:420px;color:#8f877d;font:13px/1.8 "Font1",sans-serif}
.order-pill{
  display:inline-block;margin:24px auto;padding:13px 22px;
  border:1px solid rgba(217,164,65,.30);
  background:rgba(217,164,65,.07);
  color:#e2bf69;font:700 13px "Font1",sans-serif;letter-spacing:1.5px;
}
.home-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:200px;min-height:50px;margin-top:8px;padding:0 24px;
  border:1px solid rgba(236,198,105,.48);
  background:linear-gradient(100deg,#8e631c,#d8aa4a 48%,#9b6d20);
  color:#100d08;text-decoration:none;
  font:700 10px "Font1",sans-serif;letter-spacing:2.3px;
  transition:transform .25s,filter .25s;
}
.home-btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.confirm-footer{margin:0 auto 40px;text-align:center;color:#514b45;font:9px "Font1",sans-serif;letter-spacing:3px}
#cart-toast{display:none !important}

@media(max-width:430px){
  .confirm-card{margin:96px auto 40px}
  .confirm-inner{padding:34px 20px}
  .confirm-inner h1{font-size:36px}
}
</style>
<link rel="stylesheet" href="shared-navbar.css">
<link rel="stylesheet" href="free-delivery.css">
</head>
<body class="confirm-page">
<section class="confirm-card">
  <div class="confirm-inner">
    <div class="mark">✓</div>
    <p class="eyebrow">LIWI-KA</p>
    <h1 id="confirmationTitle">Placing your order…</h1>
    <p class="muted" id="confirmationMessage">We are securely validating your order and reserving your chocolates.</p>
    <div class="order-pill" id="order">PLEASE WAIT</div>
    <p class="muted" id="paymentState" style="margin-top:4px"></p>
    <br>
    <a class="home-btn" id="confirmationAction" href="index.html">BACK TO HOME</a>
    <p class="muted" id="confirmationError" role="alert" style="color:#d9a5a0;margin-top:14px"></p>
  </div>
</section>
<footer class="confirm-footer">
        <nav class="liwika-legal-links" aria-label="Legal policies" style="display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:12px auto 0;font-size:10px;letter-spacing:.7px;line-height:1.5"><a href="privacy-policy.html" style="text-decoration:underline;text-underline-offset:3px;opacity:.8">Privacy Policy</a><a href="terms-conditions.html" style="text-decoration:underline;text-underline-offset:3px;opacity:.8">Terms &amp; Conditions</a></nav>
</footer>
<script src="cart.js"></script>
<script src="free-delivery.js"></script>
<script type="module">
  import { auth, db, persistenceReady } from './firebase-config.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js';
  import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
  const $ = id => document.getElementById(id);
  const fail = (message) => {
    $('confirmationTitle').textContent = 'We could not place your order.';
    $('confirmationMessage').textContent = 'Your cart has been kept safe. Please review your details and try again.';
    $('order').textContent = 'ORDER NOT PLACED';
    $('confirmationError').textContent = message || 'Please try again.';
    $('confirmationAction').href = 'seasonals/cart.html';
    $('confirmationAction').textContent = 'RETURN TO CART';
    sessionStorage.removeItem('liwika_payment_complete');
    sessionStorage.removeItem('liwika_order_submit_started');
  };
  async function placeOrder() {
    if (sessionStorage.getItem('liwika_payment_complete') !== '1') { location.replace('seasonals/cart.html'); return; }
    const details = JSON.parse(sessionStorage.getItem('liwika_checkout_details') || 'null');
    const intent = sessionStorage.getItem('liwika_checkout_intent');
    const method = sessionStorage.getItem('liwika_payment_method') || 'Cash on Delivery';
    const items = window.LiwikaCart?.getItems?.() || [];
    if (!details || !intent || !items.length) { fail('Your checkout session is incomplete. Please return to your cart.'); return; }
    if (sessionStorage.getItem('liwika_order_submit_started') === '1') {
      // A reload may occur while a previous request is resolving. The server
      // uses the same intent ID to make retries idempotent, so retry is safe.
    }
    sessionStorage.setItem('liwika_order_submit_started', '1');
    try {
      await persistenceReady;
      const user = auth.currentUser;
      if (!user) { location.replace('login.html?returnTo=' + encodeURIComponent('checkout.html')); return; }
      const functions = getFunctions(undefined, 'asia-south1');
      const createOrder = httpsCallable(functions, 'createCustomerOrder');
      const result = await createOrder({
        checkoutIntentId: intent,
        items: items.map(item => ({ productId: item.id, quantity: item.quantity, flavour: item.flavour || 'Classic' })),
        shippingAddress: details,
        paymentMethod: method,
        email: user.email || ''
      });
      const order = result.data || {};
      $('confirmationTitle').textContent = 'Your order is placed.';
      $('confirmationMessage').textContent = method === 'Cash on Delivery'
        ? 'Thank you. Your order has been recorded. Payment will be collected on delivery within Visakhapatnam.'
        : 'Thank you. Your order is recorded, but online payment has not been processed yet. The payment status is pending verification.';
      $('order').textContent = 'Order ' + (order.orderNumber || order.orderId);
      $('paymentState').textContent = 'Payment status: ' + (order.paymentStatus || 'pending');
      $('confirmationAction').href = 'index.html';
      $('confirmationAction').textContent = 'BACK TO HOME';
      try { localStorage.setItem('liwika_last_order', JSON.stringify({ orderId: order.orderId, orderNumber: order.orderNumber, email: user.email || '', createdAt: new Date().toISOString() })); } catch (_) {}
      window.LiwikaCart?.clearCart?.();
      ['liwika_checkout_details','liwika_checkout_total','liwika_payment_method','liwika_payment_complete','liwika_checkout_intent','liwika_order_submit_started'].forEach(key => sessionStorage.removeItem(key));
    } catch (error) {
      console.error('Order placement failed:', error);
      fail(error?.message || 'We could not connect to the order service. Your cart has not been cleared.');
    }
  }
  placeOrder();
</script>
</body>
</html>
