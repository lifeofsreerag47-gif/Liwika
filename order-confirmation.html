</head><body><main class="card"><div class="mark">✓</div><p class="ey">LIWI-KA</p><h1>Order confirmed.</h1><p class="muted">Thank you. Your sweetest moment is now on its way.</p><div class="order" id="order"></div><a class="home" href="index.html">BACK TO HOME</a></main><script>(function(){const complete=sessionStorage.getItem('liwika_payment_complete');if(complete!=='1'){location.href='seasonals/cart.html';return}let order=sessionStorage.getItem('liwika_current_order_number');if(!order){order='LK-'+String(Date.now()%90000+10000);sessionStorage.setItem('liwika_current_order_number',order)}document.getElementById('order').textContent='Order '+order;try{localStorage.setItem('liwika_last_order',JSON.stringify({orderNumber:order,email:(JSON.parse(localStorage.getItem('liwika_auth_session')||'{}').email||''),createdAt:new Date().toISOString()}))}catch(e){}if(window.LiwikaCart){window.LiwikaCart.clearCart&&window.LiwikaCart.clearCart()}})();</script>    <script src="free-delivery.js"></script>
</body></html>
